[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eliza-agent-core"
version = "5.0.0"
description = "Lightweight local AI agent core on llama.cpp"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "allinvvs" }]
dependencies = [
    "psutil>=5.9.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "ddgs>=7.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
cuda = [
    "llama-cpp-python>=0.3.0",
    "nvidia-ml-py>=12.535.0",
]
cpu = [
    "llama-cpp-python>=0.3.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
eliza = "main:main"
eliza-server = "server:main"

[tool.setuptools]
py-modules = ["main", "server"]
[tool.setuptools.packages.find]
include = ["core*", "plugins*"]

